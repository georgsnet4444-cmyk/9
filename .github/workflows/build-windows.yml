name: Build Windows VST3

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build VST3 (Release)
        run: cmake --build build --config Release --target NorthstarMastering_VST3 --parallel

      - name: Verify and stage bundle
        shell: bash
        run: |
          bundle="build/NorthstarMastering_artefacts/Release/VST3/Northstar Master.vst3"
          if [ ! -f "$bundle/Contents/x86_64-win/Northstar Master.vst3" ]; then
            echo "Plug-in binary not found"
            find build/NorthstarMastering_artefacts -maxdepth 4
            exit 1
          fi
          mkdir -p stage
          cp -r "$bundle" stage/
          cd stage
          7z a ../Northstar-Master-VST3-Windows-x64.zip "Northstar Master.vst3"

      - uses: actions/upload-artifact@v4
        with:
          name: Northstar-Master-VST3-Windows-x64
          path: stage

      - name: Publish release (only for v* tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Northstar-Master-VST3-Windows-x64.zip
